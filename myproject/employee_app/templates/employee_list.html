<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emp_list</title>
    <style>
        table,tr,th,td{
            border: 1px solid;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <form action="" method="get">
        <input type="text" name="search" placeholder="Search by name">

    <select name="department" id="">
        <option value="">Department</option>
        {% for d in employees1 %}
            <option value="{{d.id}}">{{d.department}}</option>
        {% endfor %}
    </select>
    <button type="submit">Apply</button>
    </form>
<br><br>
    <table>
        <tr>
            <th>Employee_id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Salary</th>
            <th>Profile Image</th>
            <th>Action</th>
        </tr>
        {% for x in employees %}
        <tr>
            <td>{{x.id}}</td>
            <td>{{x.name}}</td>
            <td>{{x.email}}</td>
            <td>{{x.phone}}</td>
            <td>{{x.department}}</td>
            <td>{{x.designation}}</td>
            <td>{{x.salary}}</td>
            <td><img src="{{x.profile_image.url}}" alt="Profile Image" width="50px" height="50px"></td>
            <td><button><a href="{% url 'edit_employee' id=x.id %}">Edit</a></button><button>
                <a href="{% url 'delete_employee' id=x.id %}">Delete</a></button></td>
        </tr>
        {% endfor %}
    </table>
    <button type="button"><a href="{% url 'add_employee' %}">Add Employee</a></button>
</body>
</html>
